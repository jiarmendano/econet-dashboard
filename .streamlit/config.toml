# Mirrors the THEMES dict in biomet_app.py. This exists only so native,
# canvas-rendered widgets (st.dataframe) and anything else outside our own
# CSS reach pick up matching colours. The app's own theme toggle is
# disabled for now and pinned to light (native st.dataframe/toolbar don't
# follow the CSS-only dark theme), so this locks the native theme to light
# too, via a single [theme] table instead of [theme.light]/[theme.dark]:
# with both defined, Streamlit's own settings menu lets a user flip the
# native theme to dark independently, which would reopen the mismatch.
# There is no sync script anymore (it caused a reload loop) — this file is
# now the only thing keeping native rendering in step with the app.
#
# To restore dark mode later: bring back [theme.light]/[theme.dark] below
# (values kept in the comment), re-enable the toggle in biomet_app.py, and
# add a native-theme sync that doesn't loop (the removed one navigated on
# every mismatch, which fought the pin).

[theme]
primaryColor = "#C24A20"
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2429"
borderColor = "#E2E0DA"

